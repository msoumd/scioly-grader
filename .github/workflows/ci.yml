name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:test@localhost:5432/sg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Known-vulnerable dependencies (pip-audit)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Migrations match models
        run: |
          DATABASE_URL=sqlite:///./ci.db uv run alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db uv run alembic check
      - name: Tests (SQLite + Postgres)
        run: uv run pytest -q
      - name: Build answer sheets for every example event
        run: |
          mkdir -p test-output/sheets
          for f in ../event_setups/*.xlsx; do
            name="$(basename "${f%.xlsx}")"
            uv run python -m app.cli make-sheet --from-xlsx "$f" --png \
              --out "test-output/sheets/${name}.pdf"
          done
      - name: Upload answer sheets
        uses: actions/upload-artifact@v4
        with:
          name: answer-sheets
          path: backend/test-output/sheets/
          if-no-files-found: error
      - name: Fake-sheet harness smoke test (every condition, oracle must be perfect)
        run: |
          for f in ../event_setups/*.xlsx; do
            name="$(basename "${f%.xlsx}")"
            ds="test-output/harness/${name}"
            uv run python -m app.harness build --from-xlsx "$f" --n 20 --out "$ds"
            uv run python -m app.harness evaluate --dataset "$ds" --reader oracle --require-perfect
            uv run python -m app.harness contact-sheet --dataset "$ds"
          done
      - name: Detection regression gate (fixed 60-sheet set vs approved baseline)
        run: |
          set -e
          for spec in "PUSO_2026_AP_event_setup:40" "EXAMPLE_forensics_event_setup:20"; do
            name="${spec%%:*}"; n="${spec##*:}"
            ds="test-output/detection/${name}"
            uv run python -m app.harness build --from-xlsx "../event_setups/${name}.xlsx" \
              --n "$n" --seed 7 --out "$ds"
            uv run python -m app.harness evaluate --dataset "$ds" --reader detector \
              --baseline "tests/regression/detector_${name}.json"
          done
      - name: Upload detection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-reports
          path: backend/test-output/detection/*/report/
          if-no-files-found: ignore
      - name: Upload harness samples
        uses: actions/upload-artifact@v4
        with:
          name: harness-samples
          path: |
            backend/test-output/harness/*/contact_sheet.jpg
            backend/test-output/harness/*/report/
            backend/test-output/harness/*/000[0-4].*
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci
      - name: Known-vulnerable runtime dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=moderate
      - name: API types match the backend
        run: |
          (cd ../backend && uv sync --locked && uv run python scripts/export_openapi.py ../frontend/openapi.json)
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci
      - run: (cd ../backend && uv sync --locked)
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build the app
        run: npm run build
      - name: Browser tests (Chromium + iPhone WebKit against the real backend)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
