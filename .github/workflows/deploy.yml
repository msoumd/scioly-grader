name: Deploy check

# After CI passes on main: make sure that exact commit goes live, then smoke-test the site.
#
# Railway (default): Railway deploys main by itself once GitHub's checks pass (service
# Settings > "Wait for CI"); this workflow only waits for the new version and tests it.
# Render (alternative): set RENDER_DEPLOY_HOOK and this workflow triggers the deploy.
#
# Does nothing until these are set (docs/DEPLOY.md):
#   variable APP_URL (e.g. https://scioly-grader.up.railway.app), secret SMOKE_PIN
#   optional secret RENDER_DEPLOY_HOOK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Not set up yet?
        id: ready
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL not set: skipping (see docs/DEPLOY.md)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with:
          ref: ${{ env.SHA }}
      - uses: astral-sh/setup-uv@v5
        if: steps.ready.outputs.go == 'true'
      - name: Trigger Render deploy of ${{ env.SHA }} (Render only)
        if: steps.ready.outputs.go == 'true' && env.HOOK != ''
        run: curl -fsS -X POST "${HOOK}&ref=${SHA}" -o /dev/null
      - name: Wait for it to go live, then smoke-test
        if: steps.ready.outputs.go == 'true'
        working-directory: backend
        env:
          SMOKE_PIN: ${{ secrets.SMOKE_PIN }}
        run: uv run --no-dev python scripts/smoke.py "$APP_URL" --commit "$SHA" --wait 1200
