# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Secrets marked "sync: false" are typed into the dashboard, never committed.
services:
  - type: web
    name: scioly-grader
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "starter" ($7, 0.5 CPU, 512 MB) works for setup and testing. Switch to "standard"
    # ($25, 1 CPU, 2 GB) for tournament week in the dashboard (docs/DEPLOY.md). Never
    # "free": it sleeps when idle.
    plan: starter
    region: oregon
    healthCheckPath: /health
    # Deploys are triggered by .github/workflows/deploy.yml after CI passes on main.
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_BUCKET
        value: scans
      - key: READER_WORKERS
        value: "2"
      # Render's HTTPS front end appends the caller's IP to X-Forwarded-For. Check after
      # the first deploy (docs/DEPLOY.md, "Check the login limiter sees real IPs").
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL # Supabase pooler connection string
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TOURNAMENT_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: SENTRY_DSN # optional
        sync: false
