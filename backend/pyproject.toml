[project]
name = "scioly-grader"
version = "0.1.0"
description = "Science Olympiad bubble-sheet grader"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.17",
    "reportlab>=5.1.0",
    "segno>=1.6.6",
    "opencv-contrib-python-headless>=5.1.0.95",
    "pypdfium2>=5.15.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.170.17",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
